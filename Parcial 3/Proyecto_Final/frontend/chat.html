<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA - Agente de Soporte</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fafafa; color: #333; height: 100vh; display: flex; flex-direction: column; }
        
        /* Navbar */
        header { background: white; padding: 15px 40px; box-shadow: 0 1px 5px rgba(0,0,0,0.05); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2em; font-weight: bold; text-decoration: none; color: #000; }
        nav { display: flex; gap: 20px; align-items: center; }
        nav a { text-decoration: none; color: #666; font-size: 0.9em; font-weight: 500; }
        nav a:hover { color: #000; font-weight: 600; }
        
        /* Contenedor del Chat */
        .chat-container { flex: 1; max-width: 800px; margin: 20px auto; width: 100%; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #111; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 1.2em; }
        
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: #fdfdfd; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 18px; border-radius: 15px; font-size: 0.95em; line-height: 1.4; }
        .msg.bot { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.user { background: #667eea; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .chat-input-area { padding: 20px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #ccc; border-radius: 25px; font-size: 1em; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #667eea; }
        button { background: #111; color: white; border: none; padding: 0 25px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #333; }
        
        .typing { font-style: italic; color: #888; font-size: 0.85em; display: none; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🖥️ Tienda Inteligente</a>
        <nav>
            <a href="catalog.html">Productos</a>
            <a href="ofertas.html">Ofertas</a>
            <a href="armatupc.html">Arma tu PC</a>
            <a href="soporte.html">Soporte</a>
            <a href="checkout.html" style="color: #000; font-size: 1.2em;"><i class="bi bi-cart2"></i></a>
        </nav>
    </header>

    <div class="chat-container">
        <div class="chat-header">
            <i class="bi bi-robot"></i> Agente 1 - Especialista en Hardware
        </div>
        
        <div class="chat-messages" id="chatBox">
            <div class="msg bot">¡Hola! Soy el Agente 1 de Tienda Inteligente. ¿En qué puedo asesorarte hoy sobre componentes de PC?</div>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe tu duda aquí..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Enviar <i class="bi bi-send"></i></button>
        </div>
        <div class="typing" id="typingIndicator" style="padding: 0 20px 10px 20px;">El agente está escribiendo...</div>
    </div>

    <script>
        // Si no tienes instalada la librería marked para formatear las respuestas de IA, la jalamos vía CDN temporalmente
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";
        document.head.appendChild(script);

        function addMessage(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${sender}`;
            
            // Si es el bot, parseamos Markdown por si la IA usa negritas o listas
            if(sender === 'bot' && window.marked) {
                msgDiv.innerHTML = marked.parse(text);
            } else {
                msgDiv.innerText = text;
            }
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const message = inputField.value.trim();
            if (!message) return;

            addMessage(message, "user");
            inputField.value = "";
            
            document.getElementById("typingIndicator").style.display = "block";

            try {
                const response = await fetch('http://127.0.0.1:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                document.getElementById("typingIndicator").style.display = "none";
                
                if(response.ok) {
                    addMessage(data.reply, "bot");
                } else {
                    addMessage("Error: No me pude conectar con el cerebro del servidor.", "bot");
                }
            } catch (error) {
                document.getElementById("typingIndicator").style.display = "none";
                addMessage("Ups, parece que el servidor está apagado o hay un problema de conexión.", "bot");
            }
        }
    </script>
</body>
</html>
