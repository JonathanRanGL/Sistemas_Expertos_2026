<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Tienda Inteligente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; background:#f8f9fa; color:#222; padding:20px; }
        .container { max-width:900px; margin: 0 auto; background:white; padding:20px; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,0.05); }
        h1 { margin-bottom:10px; }
        .cart-list { margin:20px 0; }
        .cart-item { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid #eee; }
        .muted { color:#666; font-size:0.95em; }
        .row { display:flex; gap:10px; }
        .col { flex:1; }
        .btn-primary { background:#667eea; color:white; border:none; padding:12px 18px; border-radius:8px; cursor:pointer; }
        .btn-secondary { background:#eee; color:#333; border:none; padding:10px 14px; border-radius:8px; cursor:pointer; }
        input, textarea { width:100%; padding:10px; border:1px solid #ddd; border-radius:6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Checkout</h1>
        <p class="muted">Revisa tu carrito y confirma el pedido.</p>

        <div id="cartArea">
            <div class="cart-list" id="cartList"></div>
            <div style="text-align:right; margin-top:12px;"><strong>Total: <span id="cartTotal">$0.00</span></strong></div>
        </div>

        <hr>

        <div style="margin-top:16px;">
            <h3>Detalles del cliente</h3>
            <div class="row">
                <div class="col">
                    <label>Cliente ID (si ya existe)</label>
                    <input type="number" id="clienteId" placeholder="Dejar vacío para cliente invitado">
                </div>
                <div class="col">
                    <label>Notas</label>
                    <input type="text" id="notas" placeholder="Notas para el pedido (opcional)">
                </div>
            </div>

            <div style="margin-top:18px; display:flex; gap:10px;">
                <button class="btn-primary" id="confirmBtn">Confirmar pedido</button>
                <button class="btn-secondary" id="clearBtn">Vaciar carrito</button>
            </div>

            <div id="message" style="margin-top:18px;"></div>
            <div id="orderSummary" style="margin-top:18px;"></div>
        </div>
    </div>

    <script>
        const BASE_API_URL = 'http://127.0.0.1:8000/api';
        const CART_KEY = 'tienda_cart_v1';

        function loadCart() { try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch(e) { return []; } }
        function saveCart(cart) { localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
        function clearCart() { localStorage.removeItem(CART_KEY); renderCart(); }

        async function fetchProduct(id) {
            try {
                const resp = await fetch(`${BASE_API_URL}/products?q=&category=&brand=&max_price=`);
                const list = await resp.json();
                return list.find(p => p.id === id);
            } catch (e) { return null; }
        }

        async function renderCart() {
            const cart = loadCart();
            const area = document.getElementById('cartList');
            area.innerHTML = '';
            if (!cart || cart.length === 0) { area.innerHTML = '<p class="muted">Tu carrito está vacío.</p>'; document.getElementById('cartTotal').textContent = '$0.00'; return; }

            let total = 0;
            for (const item of cart) {
                const prod = await fetchProduct(item.producto_id);
                const name = prod ? prod.nombre : `Producto #${item.producto_id}`;
                const price = prod ? Number(prod.precio) : 0;
                const subtotal = price * item.cantidad;
                total += subtotal;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div><strong>${name}</strong><div class="muted">ID: ${item.producto_id}</div></div>
                    <div style="text-align:right;"><div>${item.cantidad} x $${price.toLocaleString()}</div><div><strong>$${subtotal.toLocaleString()}</strong></div></div>
                `;
                area.appendChild(div);
            }
            document.getElementById('cartTotal').textContent = '$' + total.toLocaleString();
        }

        document.getElementById('clearBtn').addEventListener('click', () => { clearCart(); document.getElementById('message').textContent = 'Carrito vaciado.'; setTimeout(()=>document.getElementById('message').textContent='','3000'); });

        document.getElementById('confirmBtn').addEventListener('click', async () => {
            const cart = loadCart();
            if (!cart || cart.length === 0) { document.getElementById('message').textContent = 'Carrito vacío.'; return; }

            const clienteIdRaw = document.getElementById('clienteId').value;
            const cliente_id = clienteIdRaw ? Number(clienteIdRaw) : null;
            const notas = document.getElementById('notas').value || '';

            const payload = {
                cliente_id: cliente_id,
                items: cart.map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad })),
                notas: notas,
            };

            try {
                const resp = await fetch(`${BASE_API_URL}/orders`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                const data = await resp.json();
                if (!resp.ok) { throw new Error(data.detail || 'Error al crear pedido'); }

                document.getElementById('message').innerHTML = `<div style="color:green;">Pedido creado: #${data.pedido_id}. Total: $${data.total}</div>`;
                renderOrderSummary(data);
                clearCart();
            } catch (err) {
                console.error(err);
                document.getElementById('message').innerHTML = `<div style="color:red;">No se pudo crear el pedido: ${err.message}</div>`;
            }
        });

        function renderOrderSummary(data) {
            const summaryArea = document.getElementById('orderSummary');
            const rulesList = data.resumen.reglas_aplicadas || [];
            const warnings = data.resumen.advertencias || [];
            const recommendations = data.resumen.recomendaciones || [];

            summaryArea.innerHTML = `
                <div style="margin-top:20px; padding:16px; border:1px solid #ddd; border-radius:8px; background:#f7f7f7;">
                    <h3>Resumen del pedido</h3>
                    <p><strong>ID:</strong> ${data.pedido_id}</p>
                    <p><strong>Subtotal:</strong> $${data.subtotal.toLocaleString()}</p>
                    <p><strong>Descuento:</strong> $${data.descuento.toLocaleString()}</p>
                    <p><strong>Total final:</strong> $${data.total.toLocaleString()}</p>
                    <p><strong>Envío gratis:</strong> ${data.envio_gratis ? 'Sí' : 'No'}</p>
                    <p><strong>Explicación del agente:</strong></p>
                    <p>${data.notas_agente}</p>
                    <p><strong>Reglas aplicadas:</strong> ${rulesList.length ? rulesList.join(', ') : 'Ninguna'}</p>
                    <p><strong>Avisos:</strong> ${warnings.length ? warnings.join('; ') : 'Ninguno'}</p>
                    <p><strong>Recomendaciones:</strong> ${recommendations.length ? recommendations.join('; ') : 'Ninguna'}</p>
                </div>
            `;
        }

        // Inicializar vista
        renderCart();
    </script>
</body>
</html>
