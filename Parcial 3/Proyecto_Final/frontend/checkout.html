<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Tienda Inteligente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #f8f9fa; color: #333; }

        header { background: white; padding: 15px 40px; box-shadow: 0 1px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2em; font-weight: bold; text-decoration: none; color: #000; cursor: pointer; }
        nav { display: flex; gap: 20px; align-items: center; }
        nav a { text-decoration: none; color: #666; font-size: 0.9em; font-weight: 500; }
        nav a:hover { color: #000; font-weight: 600; }

        .page { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { margin-bottom: 25px; color: #1a1a1a; font-size: 2em; font-weight: 800; }

        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; gap: 15px; }
        .cart-item-info { display: flex; flex-direction: column; gap: 4px; }
        .cart-item-name { font-size: 1.05em; font-weight: 600; }
        .cart-item-meta { font-size: 0.85em; color: #999; }
        .cart-item-controls { display: flex; align-items: center; gap: 12px; }
        .qty-controls { display: flex; align-items: center; gap: 8px; border: 1px solid #e0e0e0; border-radius: 8px; padding: 4px 8px; }
        .qty-controls button { background: none; border: none; cursor: pointer; font-size: 1.1em; padding: 0 6px; color: #666; }
        .qty-controls button:hover { color: #667eea; }
        .cart-item-price { font-weight: 700; min-width: 90px; text-align: right; }
        .btn-remove { background: none; border: none; color: #dc3545; cursor: pointer; font-size: 1.1em; }
        .btn-remove:hover { color: #a30000; }

        .totals { margin-top: 20px; padding-top: 20px; border-top: 2px solid #f0f0f0; display: flex; flex-direction: column; gap: 8px; }
        .totals-row { display: flex; justify-content: space-between; font-size: 1em; color: #555; }
        .totals-row.total { font-size: 1.3em; font-weight: 800; color: #1a1a1a; }
        .totals-row.discount { color: #28a745; }

        .actions { margin-top: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .btn { padding: 14px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 1em; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-primary { background: #2c2c2c; color: white; }
        .btn-primary:hover { background: #667eea; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-secondary { background: white; color: #666; border: 2px solid #e0e0e0; }
        .btn-secondary:hover { border-color: #667eea; color: #667eea; }

        .agent-box { margin-top: 35px; padding: 25px; border-radius: 10px; background: #f0f4ff; border-left: 5px solid #667eea; display: none; transition: all 0.3s; }
        .agent-box h3 { display: flex; align-items: center; gap: 10px; font-size: 1.2em; margin-bottom: 15px; color: #333; }
        .agent-response { line-height: 1.7; font-size: 1.05em; color: #444; }
        .agent-response ul { margin: 10px 0 0 20px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">🖥️ Tienda Inteligente</a>
        <nav>
            <a href="catalog.html">Productos</a>
            <a href="ofertas.html">Ofertas</a>
            <a href="armatupc.html">Arma tu PC</a>
            <a href="soporte.html">Soporte</a>
            <a href="chat.html" style="color:#000; font-size:0.9em;"><i class="bi bi-robot"></i> Asistente IA</a>
        </nav>
    </header>

    <div class="page">
        <div class="container">
            <h1>🛒 Finalizar Pedido</h1>

            <div id="cartItems">Cargando carrito...</div>

            <div class="totals" id="totalsBox" style="display:none;">
                <div class="totals-row"><span>Subtotal</span><span id="totalSubtotal">$0.00</span></div>
                <div class="totals-row discount" id="discountRow" style="display:none;"><span>Descuento</span><span id="totalDiscount">-$0.00</span></div>
                <div class="totals-row total"><span>Total</span><span id="totalFinal">$0.00</span></div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" onclick="window.location.href='catalog.html'"><i class="bi bi-arrow-left"></i> Volver al Catálogo</button>
                <button class="btn btn-primary" onclick="procesarCheckout()" id="checkoutBtn"><i class="bi bi-credit-card"></i> Confirmar y Pagar</button>
            </div>

            <!-- Caja de Explicabilidad del Agente 3 -->
            <div class="agent-box" id="agentBox">
                <h3><i class="bi bi-robot"></i> Análisis del Agente Supervisor</h3>
                <div class="agent-response" id="agentResponse"></div>
            </div>
        </div>
    </div>

    <script>
        const BASE_API_URL = 'http://127.0.0.1:8080/api';
        const CART_KEY = 'tienda_cart_v1';
        let productCache = {};

        function loadCart() {
            try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch (e) { return []; }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        async function fetchProductInfo(id) {
            if (productCache[id]) return productCache[id];
            try {
                const res = await fetch(`${BASE_API_URL}/products/${id}`);
                if (!res.ok) return null;
                const data = await res.json();
                productCache[id] = data;
                return data;
            } catch (e) {
                return null;
            }
        }

        async function renderCart() {
            const cart = loadCart();
            const container = document.getElementById('cartItems');
            const totalsBox = document.getElementById('totalsBox');

            if (cart.length === 0) {
                container.innerHTML = '<p style="color: #999; padding: 20px 0; text-align:center;">Tu carrito está vacío.</p>';
                document.getElementById('checkoutBtn').style.display = 'none';
                totalsBox.style.display = 'none';
                return;
            }

            let subtotal = 0;
            const rows = [];

            for (let i = 0; i < cart.length; i++) {
                const item = cart[i];

                if (item.es_build) {
                    const precio = item.precio_estimado || 0;
                    subtotal += precio * item.cantidad;
                    rows.push(`
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <span class="cart-item-name">${item.descripcion_build || 'PC Armada'}</span>
                                <span class="cart-item-meta">Ensamblado personalizado</span>
                            </div>
                            <div class="cart-item-controls">
                                <span class="cart-item-price">${precio ? '$' + precio.toLocaleString(undefined, {minimumFractionDigits:2}) : 'Estimado'}</span>
                                <button class="btn-remove" onclick="removeItem(${i})"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    `);
                    continue;
                }

                const product = await fetchProductInfo(item.producto_id);
                const nombre = product ? product.nombre : `Componente #${item.producto_id}`;
                const precioUnit = product ? product.precio : 0;
                const lineTotal = precioUnit * item.cantidad;
                subtotal += lineTotal;

                rows.push(`
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <span class="cart-item-name">${nombre}</span>
                            <span class="cart-item-meta">${product ? '$' + precioUnit.toLocaleString(undefined, {minimumFractionDigits:2}) + ' c/u' : 'Producto no disponible'}</span>
                        </div>
                        <div class="cart-item-controls">
                            <div class="qty-controls">
                                <button onclick="changeQty(${i}, -1)">−</button>
                                <span>${item.cantidad}</span>
                                <button onclick="changeQty(${i}, 1)">+</button>
                            </div>
                            <span class="cart-item-price">$${lineTotal.toLocaleString(undefined, {minimumFractionDigits:2})}</span>
                            <button class="btn-remove" onclick="removeItem(${i})"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                `);
            }

            container.innerHTML = rows.join('');

            document.getElementById('totalSubtotal').textContent = '$' + subtotal.toLocaleString(undefined, {minimumFractionDigits:2});
            document.getElementById('totalFinal').textContent = '$' + subtotal.toLocaleString(undefined, {minimumFractionDigits:2});
            document.getElementById('discountRow').style.display = 'none';
            totalsBox.style.display = 'flex';
            document.getElementById('checkoutBtn').style.display = 'inline-flex';
        }

        function changeQty(index, delta) {
            const cart = loadCart();
            if (!cart[index]) return;
            cart[index].cantidad = Math.max(1, (cart[index].cantidad || 1) + delta);
            saveCart(cart);
            renderCart();
        }

        function removeItem(index) {
            const cart = loadCart();
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
        }

        async function procesarCheckout() {
            const cart = loadCart();
            const btn = document.getElementById('checkoutBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Procesando por Motores de Inferencia...';

            // Los items de tipo "build" no se mandan al backend (aún no existen como
            // productos individuales); se procesan solo los componentes reales del catálogo.
            const itemsParaBackend = cart.filter(i => !i.es_build).map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad }));

            if (itemsParaBackend.length === 0) {
                const agentBox = document.getElementById('agentBox');
                const agentResponse = document.getElementById('agentResponse');
                agentBox.style.display = 'block';
                agentBox.style.background = '#fff8e6';
                agentBox.style.borderLeftColor = '#ffc107';
                agentResponse.innerHTML = '<strong>Aviso:</strong> Las PCs armadas personalizadas aún no se procesan en el checkout del backend. Agrega también productos del catálogo para confirmar el pedido.';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-credit-card"></i> Confirmar y Pagar';
                return;
            }

            try {
                const response = await fetch(`${BASE_API_URL}/orders/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cliente_id: 1, items: itemsParaBackend })
                });

                const data = await response.json();
                const agentBox = document.getElementById('agentBox');
                const agentResponse = document.getElementById('agentResponse');

                agentBox.style.display = 'block';

                if (response.ok) {
                    agentBox.style.background = '#e6ffed';
                    agentBox.style.borderLeftColor = '#28a745';

                    let extra = '';
                    if (data.inferencias && data.inferencias.recommendations && data.inferencias.recommendations.length) {
                        extra += '<ul>' + data.inferencias.recommendations.map(r => `<li>${r}</li>`).join('') + '</ul>';
                    }
                    if (data.inferencias && data.inferencias.warnings && data.inferencias.warnings.length) {
                        extra += '<ul>' + data.inferencias.warnings.map(w => `<li>⚠ ${w}</li>`).join('') + '</ul>';
                    }

                    agentResponse.innerHTML = `<strong style="color: #28a745; font-size:1.1em;">¡Transacción Aprobada! (Pedido #${data.pedido_id})</strong><br><br>${data.explicacion_agente3}${extra}`;

                    localStorage.removeItem(CART_KEY);
                    document.getElementById('cartItems').innerHTML = '';
                    document.getElementById('totalsBox').style.display = 'none';
                    btn.style.display = 'none';
                } else {
                    agentBox.style.background = '#ffe6e6';
                    agentBox.style.borderLeftColor = '#dc3545';
                    agentResponse.innerHTML = `<strong style="color: #dc3545;">Restricción del Agente:</strong><br>${data.detail}`;

                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-credit-card"></i> Reintentar Pago';
                }
            } catch (error) {
                const agentBox = document.getElementById('agentBox');
                const agentResponse = document.getElementById('agentResponse');
                agentBox.style.display = 'block';
                agentBox.style.background = '#ffe6e6';
                agentBox.style.borderLeftColor = '#dc3545';
                agentResponse.innerHTML = '<strong style="color: #dc3545;">Error de conexión: Verifica que el servidor backend esté corriendo</strong>';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-credit-card"></i> Confirmar y Pagar';
            }
        }

        renderCart();
    </script>
</body>
</html>
