<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofertas - Tienda Inteligente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #333;
        }
        
        /* ========== HEADER ========== */
        header {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        
        .logo {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
            cursor: pointer;
        }
        
        nav {
            flex: 1;
            display: flex;
            gap: 30px;
            justify-content: center;
        }
        
        nav a {
            text-decoration: none;
            color: #666;
            font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
        }
        
        nav a:hover {
            color: #667eea;
        }
        
        .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .btn-ia {
            background: #2c2c2c;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .btn-ia:hover {
            background: #667eea;
        }
        
        /* ========== MAIN CONTENT ========== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .page-title {
            margin-bottom: 40px;
            text-align: center;
        }
        
        .page-title h1 {
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        
        .page-title p {
            color: #666;
            font-size: 1.1em;
        }
        
        /* ========== PRODUCTS GRID ========== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }
        
        .product-image {
            background-color: #ffffff;
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5em;
            position: relative;
            overflow: hidden;
        }
        
        .product-trending {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #555;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            z-index: 1;
        }

        .product-discount {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ff4444;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            z-index: 1;
        }

        /* Product images */
        .product-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; padding: 12px; }
        .product-img-fallback { font-size: 3.5em; }
        
        .product-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .product-category {
            color: #667eea;
            font-size: 0.75em;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .product-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.05em;
            line-height: 1.4;
            min-height: 2.8em;
        }
        
        .product-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
            font-size: 0.85em;
        }
        
        .stars {
            color: #ffc107;
            font-size: 0.9em;
        }
        
        .rating-count {
            color: #999;
            font-size: 0.8em;
        }
        
        .price-container {
            margin-bottom: 15px;
        }

        .product-oldprice {
            color: #999;
            text-decoration: line-through;
            font-size: 0.95em;
            margin-bottom: 2px;
        }
        
        .product-price {
            font-size: 1.5em;
            font-weight: 700;
            color: #ff4444;
        }
        
        .product-stock {
            font-size: 0.85em;
            margin-bottom: 15px;
            padding: 6px 10px;
            background: #f0f0f0;
            border-radius: 6px;
            display: inline-block;
        }
        
        .stock-available {
            color: #4caf50;
        }
        
        .stock-low {
            color: #ff9800;
        }
        
        .product-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }
        
        .btn-add {
            flex: 1;
            background: #ff4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        .btn-add:hover {
            background: #cc0000;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 68, 68, 0.2);
        }
        
        .btn-favorite {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s;
            color: #999;
        }
        
        .btn-favorite:hover {
            border-color: #ff4444;
            color: #ff4444;
        }
        
        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .navbar-container {
                flex-wrap: wrap;
            }
            
            nav {
                order: 3;
                width: 100%;
                gap: 15px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- ========== HEADER ========== -->
    <header>
        <div class="navbar-container">
            <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">🖥️ Tienda Inteligente</div>
            
            <nav>
                <a href="catalog.html">Productos</a>
                <a href="ofertas.html" style="color: #ff4444; font-weight: 700;">Ofertas</a>
                <a href="armatupc.html">Arma tu PC</a>
                <a href="soporte.html">Soporte</a>
            </nav>
            
            <div class="nav-right">
                <button class="btn-ia" onclick="window.location.href='chat.html'">
                    <i class="bi bi-cpu"></i> Asistente IA
                </button>
                <div id="cartButton" style="position:relative; cursor:pointer;" onclick="window.location.href='checkout.html'">
                    <i class="bi bi-cart" style="font-size:1.2em;"></i>
                    <span id="cartCount" style="position:absolute; top:-6px; right:-10px; background:#ff4444; color:white; font-size:0.75em; padding:2px 6px; border-radius:12px; display:none;">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="container">
        <div class="page-title">
            <h1>🔥 Super Ofertas de Tecnología</h1>
            <p>Descuentos exclusivos por tiempo limitado validados por nuestro sistema experto</p>
        </div>

        <!-- ========== PRODUCTS GRID ========== -->
        <div class="products-grid" id="productsGrid">
            <p style="grid-column: 1/-1; text-align: center; color: #999; padding: 40px;">
                🔄 Cargando ofertas exclusivas...
            </p>
        </div>
    </div>

    <script>
        const BASE_API_URL = 'http://127.0.0.1:8080/api';

        async function fetchDeals() {
            try {
                const response = await fetch(`${BASE_API_URL}/products/deals`);
                const products = await response.json();
                renderProducts(products);
            } catch (error) {
                console.error('Error cargando ofertas:', error);
                document.getElementById('productsGrid').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999; padding: 40px;">No se pudieron cargar las ofertas. Asegúrate de que el backend esté corriendo en http://127.0.0.1:8080</p>';
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            
            if (!products || products.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999; padding: 40px;">No hay productos en oferta en este momento. ¡Vuelve pronto!</p>';
                return;
            }
            
            grid.innerHTML = products.map(product => {
                const discountPercent = product.precio_original ? Math.round((1 - product.precio / product.precio_original) * 100) : 0;
                return `
                    <div class="product-card">
                        <div class="product-image">
                            <img src="assets/products/${product.id}.png" alt="${product.nombre}" class="product-img"
                                 onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <span class="product-img-fallback" style="display:none; align-items:center; justify-content:center;">🔥</span>
                            ${product.es_tendencia ? '<div class="product-trending">📈</div>' : ''}
                            ${discountPercent > 0 ? `<div class="product-discount">-${discountPercent}%</div>` : ''}
                        </div>
                        
                        <div class="product-body">
                            <div class="product-category">${product.categoria}</div>
                            <div class="product-name">${product.nombre}</div>
                            
                            <div class="product-rating">
                                <span class="stars">★★★★★</span>
                                <span>${product.rating.toFixed(1)}</span>
                                <span class="rating-count">(${product.num_reviews})</span>
                            </div>
                            
                            <div class="price-container">
                                ${product.precio_original ? `<div class="product-oldprice">$${product.precio_original.toLocaleString()}</div>` : ''}
                                <div class="product-price">$${product.precio.toLocaleString()}</div>
                            </div>
                            
                            <div class="product-stock ${product.stock > 10 ? 'stock-available' : 'stock-low'}">
                                ${product.stock > 10 ? '✓ En stock' : `⚠ ¡Solo ${product.stock} disponibles!`}
                            </div>
                            
                            <div class="product-buttons">
                                <button class="btn-add" data-id="${product.id}">Agregar al carrito</button>
                                <button class="btn-favorite"><i class="bi bi-heart"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Carrito en localStorage
        const CART_KEY = 'tienda_cart_v1';

        function loadCart() {
            try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch(e) { return []; }
        }

        function saveCart(cart) { localStorage.setItem(CART_KEY, JSON.stringify(cart)); updateCartCount(); }

        function updateCartCount() {
            const cart = loadCart();
            const total = cart.reduce((s, it) => s + it.cantidad, 0);
            const badge = document.getElementById('cartCount');
            if (!badge) return;
            if (total > 0) { badge.style.display = 'inline-block'; badge.textContent = total; } else { badge.style.display = 'none'; }
        }

        function addToCart(productId) {
            const cart = loadCart();
            const idx = cart.findIndex(i => i.producto_id === productId);
            if (idx >= 0) { cart[idx].cantidad += 1; } else { cart.push({ producto_id: productId, cantidad: 1 }); }
            saveCart(cart);
        }

        document.addEventListener('click', (e) => {
            const btn = e.target.closest && e.target.closest('.btn-add');
            if (btn) {
                const id = Number(btn.getAttribute('data-id'));
                if (!isNaN(id)) {
                    addToCart(id);
                    btn.textContent = '✓ Agregado';
                    setTimeout(() => btn.textContent = 'Agregar al carrito', 900);
                }
            }
        });

        // Inicializar
        fetchDeals();
        updateCartCount();
    </script>
</body>
</html>
